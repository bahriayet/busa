# Blueprint Render — backend BUSA (Fastify + Neon).
# Cara pakai: push repo ini ke GitHub, lalu di Render pilih "New → Blueprint".
# Isi nilai rahasia lewat dashboard Render (sync: false).
services:
  - type: web
    name: busa-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BUSA_DATABASE_URL
        sync: false
      - key: BUSA_JWT_SECRET
        sync: false
      # Domain frontend yang boleh memanggil API (CORS). Pisahkan dengan koma
      # bila punya domain lain, mis. custom domain Vercel.
      - key: BUSA_CORS_ORIGINS
        value: https://busa-londry.vercel.app
      - key: BUSA_SERVE_STATIC
        value: "false"
      # Produksi: tahap hanya bergerak lewat /scan operator, bukan simulasi.
      # Nyalakan (true) hanya untuk demo.
      - key: BUSA_SIMULATE
        value: "false"
