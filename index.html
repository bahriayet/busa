<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laundry MAHA Dewi Mataram — Lacak Cucian &amp; Jemputan</title>
  <meta name="description" content="Laundry antar-jemput di Mataram. Lacak cucian real-time, jadwalkan jemputan sore, dan lihat harga transparan — Laundry MAHA Dewi Mataram.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Laundry MAHA Dewi Mataram">
  <meta property="og:description" content="Laundry antar-jemput di Mataram. Lacak cucian real-time, jadwalkan jemputan sore, harga transparan.">
  <meta property="og:image" content="./img/slides/02.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Laundry MAHA Dewi Mataram">
  <meta name="twitter:description" content="Laundry antar-jemput di Mataram. Lacak cucian real-time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="./img/slides/01.jpg" media="(min-width: 1001px)">
  <link rel="preload" as="image" href="./img/slides/m/01.jpg" media="(max-width: 1000px)">
  <meta name="theme-color" content="#F8F4F1">
  <meta name="busa-api-base" content="https://busa-api.onrender.com">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23111111'/><text x='12' y='16' text-anchor='middle' font-family='Arial,sans-serif' font-size='9' font-weight='700' fill='%23FF8550'>MD</text></svg>">
  <link rel="stylesheet" href="./css/app.css">
</head>

<body data-theme="bone" data-route="floor">
  <button class="skip" type="button" data-act="skip">Lewati ke konten</button>
  <div class="grain" aria-hidden="true"></div>
  <div id="suds" aria-hidden="true"></div>

  <div class="shell">
    <aside class="rail">
      <a class="brand" href="#/" data-act="go" data-route="landing" aria-label="MAHA Dewi, ke halaman situs">
        <span class="brand-monogram" aria-hidden="true">MD</span>
        <b>MAHA</b>
        <span class="brand-sub">dewi · laundry</span>
      </a>
      <nav id="nav" aria-label="Navigasi utama"></nav>
      <div class="rail-foot">
        <button class="tb-btn" id="theme-btn" data-act="theme" title="Ganti tema (T)" aria-label="Ganti tema"></button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="tb-title">
          <b id="route-title">Lantai Mesin</b>
          <span id="route-kicker">Siklus berjalan</span>
        </div>
        <div class="top-actions">
          <div id="portal-switch" class="psw" role="group" aria-label="Pilih panel"></div>
          <button class="conn" id="conn-btn" data-act="reconnect" hidden aria-live="polite" aria-label="Status server — klik untuk sambung ulang">
            <i class="conn-dot" aria-hidden="true"></i><b id="conn-label">Mode lokal</b>
          </button>
          <time id="clock">--:--:--</time>
          <button class="tb-btn" id="search-btn" data-act="palette" title="Cari / perintah (Ctrl+K)" aria-label="Palet perintah">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round">
              <circle cx="11" cy="11" r="6.6"></circle><path d="M15.8 15.8 20.4 20.4"></path>
            </svg>
          </button>
          <span class="tb-sep"></span>
          <button class="btn sm" data-act="new-order">+ Order</button>
          <div class="bell-wrap">
            <button class="tb-btn" id="bell-btn" data-act="notif" aria-label="Pemberitahuan">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round">
                <path d="M6 16V10a6 6 0 1 1 12 0v6l2 2.6H4z"></path><path d="M9.8 21a2.4 2.4 0 0 0 4.4 0"></path>
              </svg>
              <span id="bell-dot" hidden>0</span>
            </button>
          </div>
          <button class="avatar" data-act="go" data-route="setelan" aria-label="Akun Rania">RS</button>
        </div>
      </header>

      <div class="ticker" role="marquee" aria-label="Status mesin dan pesanan">
        <div id="ticker-track"></div>
      </div>

      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <nav id="mnav" class="mnav" aria-label="Navigasi mobile"></nav>

  <button class="tb-btn fab" id="chat-fab" data-act="chat" aria-label="Buka bantuan">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round">
      <path d="M4 6.5h16v10H9.5L4 20.5z"></path><path d="M8 10h8M8 13h5"></path>
    </svg>
  </button>

  <div id="notif-panel" role="dialog" aria-label="Pemberitahuan"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <div id="drawerRoot"></div>

  <script src="./js/vendor/gsap.min.js"></script>
<script src="./js/vendor/ScrollTrigger.min.js"></script>
<script src="./js/config.js"></script>
<script src="./js/data.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/views.customer.js"></script>
  <script src="./js/views.admin.js"></script>
  <script src="./js/scan.js"></script>
  <script src="./js/landing.js"></script>
  <script src="./js/motion.js"></script>
</body>

</html>
